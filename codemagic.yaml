workflows:
  ios-workflow:
    name: iOS Build
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install pods
        script: |
          cd ios
          pod install --repo-update
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/tmp/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: noourway # هذا هو اسم الـ Key الخاص بك كما ظهر في الصورة الأخيرة
        submit_to_testflight: true
