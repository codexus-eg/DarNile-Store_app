workflows:
  ios-testflight-workflow:
    name: iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        provisioning_profiles:
          - DarNile_app_profile

    scripts:
      - name: Get Dependencies
        script: flutter pub get

      - name: Generate iOS structure
        script: |
          # ده الأمر اللي بيكريت الـ ios folder والـ Podfile
          flutter build ios --config-only --no-codesign

      - name: Install Pods
        script: |
          # هنا بنروح للـ ios فولدر ونتأكد إن البودز بتنزل
          cd ios
          pod install --repo-update

      - name: Build IPA
        script: |
          # البناء النهائي
          flutter build ipa --release \
            --export-options-plist=/tmp/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
