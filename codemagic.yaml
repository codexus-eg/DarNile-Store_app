workflows:
  ios-testflight-workflow:
    name: iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        provisioning_profiles:
          - DarNile_app_profile

    scripts:
      - name: Clean and Get Dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Setup iOS Project
        script: |
          # لاحظ هنا: بنعمل build بدون كود سايننج عشان ميطلعش الخطأ ده
          flutter build ios --config-only --no-codesign
          cd ios
          if [ -f "Podfile" ]; then
            pod install --repo-update
          fi

      - name: Build Archive
        script: |
          # البناء بدون توقيع - التوقيع هيحصل في الخطوة الجاية
          flutter build ios --release --no-codesign

      - name: Apply Vault Profiles and Package IPA
        script: |
          # 1. تعريف المشروع بالبروفايل اللي في الـ Vault
          xcode-project use-profiles
          # 2. تحويل الـ Archive لـ IPA وتوقيعه بالشهادات اللي في الـ Vault
          xcode-project build-ipa --project ios/Runner.xcworkspace --scheme Runner

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
