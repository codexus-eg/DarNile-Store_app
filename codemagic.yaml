workflows:
  ios-workflow:
    name: iOS Build
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Initialize iOS
        script: |
          flutter build ios --config-only
      - name: Install pods
        script: |
          cd ios
          pod install --repo-update
      - name: Disable code signing in Xcode
        script: |
          # هذا الأمر يقوم بتعديل ملف الإعدادات وإلغاء التوقيع التلقائي
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = ""/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' ios/Runner.xcodeproj/project.pbxproj
      - name: Build Flutter for iOS
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
