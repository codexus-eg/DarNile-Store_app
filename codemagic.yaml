workflows:
  ios-testflight-workflow:
    name: iOS Build and Publish to TestFlight

    # تعريف الربط مع حساب أبل باستخدام الاسم اللي في الإعدادات
    integrations:
      app_store_connect: noourway

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.darnilestore.codexus.app
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Initialize iOS project
        script: |
          flutter build ios --config-only

      - name: Install dependencies (Pods)
        script: |
          cd ios
          pod install --repo-update

      - name: Build IPA with Automatic Code Signing
        script: |
          flutter build ipa --release \
            --export-options-plist=/tmp/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        # هنا التعديل: الكلمة الحرفية "integration" بتخليه يسحب الـ Key من فوق
        auth: integration
        submit_to_testflight: true
