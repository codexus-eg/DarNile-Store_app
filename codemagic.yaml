workflows:
  ios-testflight-workflow:
    name: iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # التعديل هنا: إبقاء الأسماء المرجعية فقط بدون ذكر الـ distribution_type
      ios_signing:
        certificates:
          - ios_dist_cert
        provisioning_profiles:
          - ios_app_profile

    scripts:
      - name: Generate iOS project structure
        script: |
          flutter create . --platforms=ios

      - name: Generate Podfile
        script: |
          flutter build ios --config-only --no-codesign

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Install Pods
        script: |
          cd ios
          pod install --repo-update

      - name: Build ipa for distribution
        script: |
          flutter build ipa --release \
            --export-options-plist=/tmp/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
