workflows:
  ios-testflight-workflow:
    name: iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        provisioning_profiles:
          - DarNile_app_profile

    scripts:
      - name: Clean and Get Dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Setup iOS Project
        script: |
          flutter build ios --config-only
          cd ios
          if [ -f "Podfile" ]; then
            pod install --repo-update
          fi

      - name: Build Archive
        script: |
          # 1. بنبني الـ Archive بس (الخطوة اللي نجحت معاك)
          flutter build ios --release

      - name: Build and Package IPA
        script: |
          # 2. بنستخدم أداة كود ماجيك عشان تحول الـ Archive لـ IPA
          # دي بتشوف البروفايل اللي في الـ Vault أوتوماتيك
          xcode-project use-profiles
          xcode-project build-ipa --project ios/Runner.xcworkspace --scheme Runner

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
