workflows:
  ios-testflight-workflow:
    name: iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        provisioning_profiles:
          - DarNile_app_profile

    scripts:
      - name: Clean Environment
        script: |
          flutter clean
          # إزالة الـ Pods القديمة والمشوهة
          cd ios
          pod deintegrate
          rm -rf Podfile.lock
          cd ..
          flutter pub get

      - name: Setup iOS Project
        script: |
          # إعادة إنشاء الـ Pods بشكل نظيف
          cd ios
          pod install --repo-update

      - name: Apply Vault Profiles
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          # بناء الـ IPA مباشرة باستخدام أمر فلاتر القياسي
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
