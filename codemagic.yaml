workflows:
  ios-testflight-workflow:
    name: iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        provisioning_profiles:
          - DarNile_app_profile

    scripts:
      - name: Clean and Get Dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Force Generate iOS project
        script: |
          # محاولة إجبارية لإنشاء المجلدات
          flutter create . --platforms=ios

      - name: Debug - Verify Podfile
        script: |
          # خطوة كشف: هنطبع محتويات المجلد عشان نعرف هو فين بالظبط
          echo "Files in ios directory:"
          ls -la ios/

      - name: Install Pods
        script: |
          # لو الملف موجود فعلاً هيكمل، لو لأ هيطلع الخطأ ونشوف الـ Logs
          cd ios
          pod install --repo-update

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/tmp/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
