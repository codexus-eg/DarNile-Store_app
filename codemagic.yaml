workflows:
  ios-testflight-workflow:
    name: iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        provisioning_profiles:
          - DarNile_app_profile

    scripts:
      - name: Clean and Get Dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Setup iOS Project and Pods
        script: |
          flutter build ios --config-only
          cd ios
          # التأكد من وجود Podfile
          if [ ! -f "Podfile" ]; then
            pod init
          fi
          pod install --repo-update

      - name: Build IPA
        script: |
          # التعديل هنا: استخدمنا أمر كود ماجيك الداخلي اللي مش بيحتاج plist خارجية
          xcode-project build-ipa --project ios/Runner.xcworkspace --scheme Runner

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
