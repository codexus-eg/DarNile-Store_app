workflows:
  ios-testflight-workflow:
    name: iOS Build and Publish to TestFlight

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Initialize iOS project
        script: |
          flutter build ios --config-only

      - name: Explicitly Define App and Fetch Certificates
        script: |
          # هنا بنعرف التطبيق بالـ Bundle ID ونجبر النظام على إنشاء الشهادات لو مش موجودة
          app-store-connect fetch-signing-files "com.darnilestore.codexus.app" \
            --type IOS_APP_STORE \
            --create

      - name: Apply Profiles to Xcode
        script: |
          # هذا الأمر يركب الشهادات اللي اتسحبت في الخطوة السابقة جوه إعدادات المشروع
          xcode-project use-profiles

      - name: Install dependencies (Pods)
        script: |
          cd ios
          pod install --repo-update

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/tmp/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
