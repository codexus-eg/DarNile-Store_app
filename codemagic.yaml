workflows:
  ios-testflight-workflow:
    name: iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    
    integrations:
      app_store_connect: noourway
      
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      
      # هنا إحنا بنقول لكود ماجيك: استخدم اللي في الخزنة بالظبط
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.darnilestore.codexus.app
        provisioning_profiles:
          - DarNile_app_profile

    scripts:
      - name: Generate iOS project structure
        script: |
          flutter create . --platforms=ios
          
      - name: Generate Podfile
        script: |
          flutter build ios --config-only --no-codesign
          
      - name: Install Pods
        script: |
          cd ios
          pod install --repo-update
          
      - name: Build ipa for distribution
        script: |
          flutter build ipa --release \
            --export-options-plist=/tmp/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com