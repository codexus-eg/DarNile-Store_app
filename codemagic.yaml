workflows:
  ios-testflight-workflow:
    name: iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        provisioning_profiles:
          - DarNile_app_profile

    scripts:
      - name: Get Dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Setup iOS Project
        script: |
          # بناء المشروع الأساسي عشان يجهز مجلدات الـ iOS
          flutter build ios --config-only

          # التحقق من وجود الـ Podfile بذكاء
          cd ios
          if [ -f "Podfile" ]; then
            echo "Podfile found, installing pods..."
            pod install --repo-update
          else
            echo "No Podfile found, skipping (using Swift Package Manager)."
          fi

      - name: Apply Vault Profiles
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
