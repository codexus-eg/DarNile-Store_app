workflows:
  ios-workflow:
    name: iOS Build
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Initialize iOS
        script: |
          flutter build ios --config-only
      - name: Install pods
        script: |
          cd ios
          pod install --repo-update
      - name: Build Flutter for iOS
        script: |
          # هنا بنضيف متغيرات بتجبر Xcode يتجاهل التوقيع
          flutter build ios --release --no-codesign --export-options-plist=none
    artifacts:
      - build/ios/iphoneos/Runner.app
