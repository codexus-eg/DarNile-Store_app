workflows:
  ios-testflight-workflow:
    name: iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Generate iOS files safely
        script: |
          flutter create . --platforms=ios
          flutter pub get

      - name: Install Pods
        script: |
          cd ios
          pod install --repo-update

      - name: Fetch Certificates & Profiles
        script: |
          app-store-connect fetch-signing-files "com.darnilestore.codexus.app" \
            --type IOS_APP_STORE \
            --create

      - name: Set up code signing
        # السطر الناجح من ملفك القديم لتطبيق الشهادات
        script: xcode-project use-profiles

      - name: Build ipa for distribution
        script: |
          flutter build ipa --release \
            --export-options-plist=/tmp/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
