workflows:
  ios-testflight-workflow:
    name: iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Generate iOS project structure
        script: |
          # إنشاء هيكل المشروع الأساسي بأمان
          flutter create . --platforms=ios
          flutter pub get

      - name: Fetch Certificates & Profiles
        script: |
          # سحب الشهادات من أبل
          app-store-connect fetch-signing-files "com.darnilestore.codexus.app" \
            --type IOS_APP_STORE \
            --create

      - name: Set up code signing
        script: |
          # تركيب الشهادات في المشروع
          xcode-project use-profiles

      - name: Generate Podfile
        script: |
          # توليد ملف الـ Podfile بأمان بعد تركيب الشهادات
          flutter build ios --config-only --no-codesign

      - name: Install Pods
        script: |
          # الآن سيعمل هذا الأمر بنجاح لوجود الـ Podfile
          cd ios
          pod install --repo-update

      - name: Build ipa for distribution
        script: |
          # البناء النهائي
          flutter build ipa --release \
            --export-options-plist=/tmp/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
