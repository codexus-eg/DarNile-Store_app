workflows:
  ios-testflight-workflow:
    name: iOS Build and Publish to TestFlight

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Generate iOS files safely
        script: |
          # إنشاء مجلد وملفات الـ iOS بأمان بدون فحص الشهادات
          flutter create . --platforms=ios
          flutter pub get

      - name: Fetch Certificates
        script: |
          # سحب الشهادات من أبل
          app-store-connect fetch-signing-files "com.darnilestore.codexus.app" \
            --type IOS_APP_STORE \
            --create

      - name: Apply Profiles
        script: |
          # تركيب الشهادات في المشروع
          xcode-project use-profiles

      - name: Install Pods
        script: |
          cd ios
          pod install --repo-update

      - name: Build IPA
        script: |
          # البناء النهائي بملف التوقيع السليم
          flutter build ipa --release \
            --export-options-plist=/tmp/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
