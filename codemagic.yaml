workflows:
  ios-testflight-workflow:
    name: iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        provisioning_profiles:
          - DarNile_app_profile

    scripts:
      - name: Clean and Get Dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Setup iOS Project
        script: |
          flutter build ios --config-only
          cd ios
          if [ -f "Podfile" ]; then
            pod install --repo-update
          fi

      - name: Apply Vault Profiles
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release
          # خطوة إضافية: التأكد من وجود الملف ونسخه لمسار ثابت
          mkdir -p build/ios/ipa
          cp -r build/ios/ipa/*.ipa . || echo "IPA not found in expected folder"

    artifacts:
      - build/ios/ipa/*.ipa
      - "*.ipa" # ضفنا دي عشان لو الملف خرج بره المجلد يلقطه

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
