workflows:
  ios-workflow:
    name: iOS Build
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Initialize iOS directory
        script: |
          flutter build ios --config-only
      - name: Install pods
        script: |
          cd ios
          pod install --repo-update
      - name: Flutter build
        script: |
          # نستخدم أمر البناء العام للـ iOS بدون إجبار التوقيع (Code Signing)
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
