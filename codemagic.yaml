workflows:
  ios-testflight-workflow:
    name: iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        provisioning_profiles:
          - DarNile_app_profile

    scripts:
      - name: Clean and Get Dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Setup iOS Project and Pods
        script: |
          # 1. محاولة تهيئة الإعدادات الأساسية
          flutter build ios --config-only

          # 2. التأكد من وجود الـ Podfile، لو مش موجود نكريته
          cd ios
          if [ ! -f "Podfile" ]; then
            echo "Podfile missing, initializing..."
            pod init
          fi

          # 3. تحديث وتثبيت البودز
          pod install --repo-update

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/tmp/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
